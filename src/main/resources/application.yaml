spring:
  application:
    name: iacym

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iacym_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mvc:
    format:
      time: HH:mm

server:
  port: ${PORT:8080}