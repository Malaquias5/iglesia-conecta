<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iglesia Conecta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <h2 class="h4 mt-5">Próximos eventos</h2>
    <p th:if="${#lists.isEmpty(eventos)}" class="text-muted">Aún no hay eventos publicados.</p>
    <div class="row g-3">
        <div class="col-md-4" th:each="e : ${eventos}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${e.titulo}">Título</h5>
                    <p class="card-text" th:text="${e.descripcion}">Descripción</p>
                    <p class="mb-0">
                        <strong th:text="${#temporals.format(e.fechaInicio, 'dd/MM/yyyy')}">Fecha</strong>
                        <span th:if="${e.hora != null}" th:text="${' · ' + #temporals.format(e.hora, 'HH:mm')}"></span>
                    </p>
                    <small class="text-muted" th:text="${e.ubicacion}">Lugar</small>
                </div>
            </div>
        </div>
    </div>
<body>
<div class="container py-5">
    <h1 class="mb-4">Bienvenidos a Iglesia Conecta</h1>
    <h2 class="h4">Nuestras reuniones</h2>
    <p th:if="${#lists.isEmpty(reuniones)}" class="text-muted">Aún no hay reuniones publicadas.</p>
    <div class="row g-3">
        <div class="col-md-4" th:each="r : ${reuniones}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${r.nombre}">Nombre</h5>
                    <p class="card-text" th:text="${r.descripcion}">Descripción</p>
                    <p class="mb-0"><strong th:text="${r.diaSemana.getDisplayName(T(java.time.format.TextStyle).FULL, new java.util.Locale('es'))}">Día</strong> · <span th:text="${#temporals.format(r.horaInicio, 'HH:mm')}">Hora</span></p>
                    <small class="text-muted" th:text="${r.lugar}">Lugar</small>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
