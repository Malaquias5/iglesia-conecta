<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: cabeceraAdmin('Panel')}"></th:block></head>
<body>
<header th:replace="~{fragments/layout :: menuAdmin}"></header>
<main class="contenedor py-4">
    <h1>Panel</h1>
    <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="tarjeta"><div class="numero" th:text="${totalReuniones}">0</div>Reuniones activas</div></div>
        <div class="col-md-4"><div class="tarjeta"><div class="numero" th:text="${totalEventos}">0</div>Próximos eventos</div></div>
        <div class="col-md-4"><div class="tarjeta"><div class="numero" th:text="${totalHermanos}">0</div>Hermanos registrados</div></div>
    </div>
    <div class="row g-3">
        <div class="col-md-6">
            <h2 class="h5">Cumpleaños de los próximos 30 días</h2>
            <p th:if="${#lists.isEmpty(cumpleanos)}" class="vacio">Sin cumpleaños próximos.</p>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between" th:each="c : ${cumpleanos}">
                    <span th:text="${c.nombre}"></span>
                    <span class="fecha" th:text="${#temporals.format(c.fecha, 'dd/MM')}"></span>
                </li>
            </ul>
        </div>
        <div class="col-md-6">
            <h2 class="h5">Últimas notificaciones</h2>
            <p th:if="${#lists.isEmpty(alertas)}" class="vacio">Aún no hay notificaciones.</p>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between" th:each="a : ${alertas}">
                    <span th:text="${#temporals.format(a.fechaEnvio, 'dd/MM/yyyy HH:mm')}"></span>
                    <span th:text="${a.estadoEnvio}"></span>
                </li>
            </ul>
        </div>
    </div>
</main>
</body>
</html>
