<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: cabeceraAdmin('Hermanos')}"></th:block></head>
<body class="adm">
<header th:replace="~{fragments/layout :: menuAdmin}"></header>
<main class="adm-main">
    <div class="adm-titulo"><h1>Hermanos</h1><p>Información privada: no se muestra en la página pública.</p></div>

    <section class="adm-card">
        <h2><i class="bi bi-person-plus-fill"></i> Registrar hermano</h2>
        <form th:action="@{/admin/hermanos}" th:object="${hermano}" method="post" class="row g-3">
            <div class="col-12 col-md-4"><label for="nombres">Nombres</label><input class="form-control" th:field="*{nombres}" required></div>
            <div class="col-12 col-md-4"><label for="apellidos">Apellidos</label><input class="form-control" th:field="*{apellidos}" required></div>
            <div class="col-12 col-md-4"><label for="fechaNacimiento">Fecha de nacimiento</label><input type="date" class="form-control" th:field="*{fechaNacimiento}" required></div>
            <div class="col-12 col-md-4"><label for="correo">Correo (opcional)</label><input class="form-control" th:field="*{correo}"></div>
            <div class="col-12 col-md-4"><label for="telefono">Teléfono (opcional)</label><input class="form-control" th:field="*{telefono}"></div>
            <div class="col-12 col-md-4 d-flex align-items-center">
                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" role="switch" th:field="*{recordatorioActivo}">
                    <label class="form-check-label" th:for="${#ids.prev('recordatorioActivo')}">Recordar su cumpleaños</label>
                </div>
            </div>
            <div class="col-12 text-md-end"><button class="btn btn-primary btn-guardar px-4"><i class="bi bi-check-lg"></i> Guardar</button></div>
        </form>
    </section>

    <section class="adm-card">
        <h2><i class="bi bi-people-fill"></i> Hermanos registrados</h2>
        <p class="vacio-adm" th:if="${#lists.isEmpty(hermanos)}">Aún no hay hermanos registrados.</p>
        <table class="tabla-adm" th:unless="${#lists.isEmpty(hermanos)}">
            <thead><tr><th>Nombre</th><th>Cumpleaños</th><th>Recordatorio</th><th></th></tr></thead>
            <tbody>
            <tr th:each="h : ${hermanos}">
                <td data-label="Nombre"><strong th:text="${h.nombres + ' ' + h.apellidos}"></strong></td>
                <td data-label="Cumpleaños" th:text="${#temporals.format(h.fechaNacimiento, 'dd/MM')}"></td>
                <td data-label="Recordatorio"><span class="pill" th:classappend="${h.recordatorioActivo} ? 'pill-ok' : 'pill-no'" th:text="${h.recordatorioActivo} ? 'Sí' : 'No'"></span></td>
                <td class="accion">
                    <form th:action="@{/admin/hermanos/{id}/eliminar(id=${h.id})}" method="post" onsubmit="return confirm('¿Eliminar este hermano?')">
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
