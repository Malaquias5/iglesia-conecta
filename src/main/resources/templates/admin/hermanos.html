<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de hermanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <a href="/admin" class="btn btn-outline-secondary btn-sm mb-3">← Panel</a>
    <h1 class="h3">Hermanos</h1>

    <form th:action="@{/admin/hermanos}" th:object="${hermano}" method="post" class="row g-2 mb-4">
        <div class="col-md-4"><input class="form-control" th:field="*{nombres}" placeholder="Nombres" required></div>
        <div class="col-md-4"><input class="form-control" th:field="*{apellidos}" placeholder="Apellidos" required></div>
        <div class="col-md-4"><input type="date" class="form-control" th:field="*{fechaNacimiento}" required></div>
        <div class="col-md-4"><input class="form-control" th:field="*{correo}" placeholder="Correo (opcional)"></div>
        <div class="col-md-4"><input class="form-control" th:field="*{telefono}" placeholder="Teléfono (opcional)"></div>
        <div class="col-md-4 d-flex align-items-center gap-3">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" th:field="*{recordatorioActivo}">
                <label class="form-check-label" for="recordatorioActivo">Recordatorio</label>
            </div>
            <button class="btn btn-primary">Guardar</button>
        </div>
    </form>

    <table class="table table-striped align-middle">
        <thead><tr><th>Nombre</th><th>Cumpleaños</th><th>Recordatorio</th><th></th></tr></thead>
        <tbody>
        <tr th:each="h : ${hermanos}">
            <td th:text="${h.nombres + ' ' + h.apellidos}"></td>
            <td th:text="${#temporals.format(h.fechaNacimiento, 'dd/MM')}"></td>
            <td th:text="${h.recordatorioActivo ? 'Sí' : 'No'}"></td>
            <td>
                <form th:action="@{/admin/hermanos/{id}/eliminar(id=${h.id})}" method="post"
                      onsubmit="return confirm('¿Eliminar este hermano?')">
                    <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
