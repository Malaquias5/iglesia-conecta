<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <a href="/admin" class="btn btn-outline-secondary btn-sm mb-3">← Panel</a>
    <h1 class="h3">Eventos</h1>

    <form th:action="@{/admin/eventos}" th:object="${evento}" method="post" class="row g-2 mb-4">
        <div class="col-md-6"><input class="form-control" th:field="*{titulo}" placeholder="Título" required></div>
        <div class="col-md-6"><input class="form-control" th:field="*{ubicacion}" placeholder="Ubicación"></div>
        <div class="col-12"><input class="form-control" th:field="*{descripcion}" placeholder="Descripción"></div>
        <div class="col-md-3"><input type="date" class="form-control" th:field="*{fechaInicio}" required></div>
        <div class="col-md-3"><input type="date" class="form-control" th:field="*{fechaFin}"></div>
        <div class="col-md-2"><input type="time" class="form-control" th:field="*{hora}"></div>
        <div class="col-md-2">
            <select class="form-select" th:field="*{estado}">
                <option th:each="s : ${estados}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>
        <div class="col-md-2"><button class="btn btn-primary w-100">Guardar</button></div>
    </form>

    <table class="table table-striped align-middle">
        <thead><tr><th>Título</th><th>Fecha</th><th>Hora</th><th>Estado</th><th></th></tr></thead>
        <tbody>
        <tr th:each="e : ${eventos}">
            <td th:text="${e.titulo}"></td>
            <td th:text="${#temporals.format(e.fechaInicio, 'dd/MM/yyyy')}"></td>
            <td th:text="${e.hora != null ? #temporals.format(e.hora, 'HH:mm') : '-'}"></td>
            <td th:text="${e.estado}"></td>
            <td>
                <form th:action="@{/admin/eventos/{id}/eliminar(id=${e.id})}" method="post"
                      onsubmit="return confirm('¿Eliminar este evento?')">
                    <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
