<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: cabeceraAdmin('Eventos')}"></th:block></head>
<body class="adm">
<header th:replace="~{fragments/layout :: menuAdmin}"></header>
<main class="adm-main">
    <div class="adm-titulo"><h1>Eventos</h1><p>Los eventos aparecen en la página cuando su estado es PROXIMO o PUBLICADO.</p></div>

    <section class="adm-card">
        <h2><i class="bi bi-plus-circle-fill"></i> Nuevo evento</h2>
        <form th:action="@{/admin/eventos}" th:object="${evento}" method="post" class="row g-3">
            <div class="col-12 col-md-6"><label for="titulo">Título</label><input class="form-control" th:field="*{titulo}" required></div>
            <div class="col-12 col-md-6"><label for="ubicacion">Ubicación</label><input class="form-control" th:field="*{ubicacion}"></div>
            <div class="col-12"><label for="descripcion">Descripción</label><input class="form-control" th:field="*{descripcion}"></div>
            <div class="col-6 col-md-3"><label for="fechaInicio">Fecha de inicio</label><input type="date" class="form-control" th:field="*{fechaInicio}" required></div>
            <div class="col-6 col-md-3"><label for="fechaFin">Fecha de fin</label><input type="date" class="form-control" th:field="*{fechaFin}"></div>
            <div class="col-6 col-md-3"><label for="hora">Hora</label><input type="time" class="form-control" th:field="*{hora}"></div>
            <div class="col-6 col-md-3">
                <label for="estado">Estado</label>
                <select class="form-select" th:field="*{estado}">
                    <option th:each="s : ${estados}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <div class="col-12 text-md-end"><button class="btn btn-primary btn-guardar px-4"><i class="bi bi-check-lg"></i> Guardar</button></div>
        </form>
    </section>

    <section class="adm-card">
        <h2><i class="bi bi-list-ul"></i> Eventos registrados</h2>
        <p class="vacio-adm" th:if="${#lists.isEmpty(eventos)}">Aún no hay eventos.</p>
        <table class="tabla-adm" th:unless="${#lists.isEmpty(eventos)}">
            <thead><tr><th>Título</th><th>Fecha</th><th>Hora</th><th>Estado</th><th></th></tr></thead>
            <tbody>
            <tr th:each="e : ${eventos}">
                <td data-label="Título"><strong th:text="${e.titulo}"></strong></td>
                <td data-label="Fecha" th:text="${#temporals.format(e.fechaInicio, 'dd/MM/yyyy')}"></td>
                <td data-label="Hora" th:text="${e.hora != null ? #temporals.format(e.hora, 'HH:mm') : '-'}"></td>
                <td data-label="Estado"><span class="pill"
                    th:classappend="${e.estado.name() == 'CANCELADO'} ? 'pill-err' : (${e.estado.name() == 'FINALIZADO'} ? 'pill-no' : 'pill-ok')"
                    th:text="${e.estado}"></span></td>
                <td class="accion">
                    <form th:action="@{/admin/eventos/{id}/eliminar(id=${e.id})}" method="post" onsubmit="return confirm('¿Eliminar este evento?')">
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
