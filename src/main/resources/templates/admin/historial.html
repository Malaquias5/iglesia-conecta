<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: cabeceraAdmin('Historial')}"></th:block></head>
<body class="adm">
<header th:replace="~{fragments/layout :: menuAdmin}"></header>
<main class="adm-main">
    <div class="adm-titulo"><h1>Historial de notificaciones</h1><p>Correos de cumpleaños enviados a los líderes.</p></div>

    <section class="adm-card">
        <h2><i class="bi bi-clock-history"></i> Envíos</h2>
        <form th:action="@{/admin/historial/ejecutar}" method="post" class="mb-3">
            <button class="btn btn-warning btn-guardar"><i class="bi bi-play-fill"></i> Revisar cumpleaños ahora (prueba)</button>
        </form>
        <p class="vacio-adm" th:if="${#lists.isEmpty(alertas)}">Aún no hay notificaciones.</p>
        <table class="tabla-adm" th:unless="${#lists.isEmpty(alertas)}">
            <thead><tr><th>Hermano</th><th>Cumpleaños</th><th>Enviado</th><th>Estado</th><th>Error</th></tr></thead>
            <tbody>
            <tr th:each="a : ${alertas}">
                <td data-label="Hermano"><strong th:text="${nombres[a.hermanoId]}"></strong></td>
                <td data-label="Cumpleaños" th:text="${#temporals.format(a.fechaCumpleanos, 'dd/MM/yyyy')}"></td>
                <td data-label="Enviado" th:text="${#temporals.format(a.fechaEnvio, 'dd/MM/yyyy HH:mm')}"></td>
                <td data-label="Estado"><span class="pill" th:classappend="${a.estadoEnvio == 'ENVIADO'} ? 'pill-ok' : 'pill-err'" th:text="${a.estadoEnvio}"></span></td>
                <td data-label="Error" th:text="${a.mensajeError}" style="word-break:break-word"></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
