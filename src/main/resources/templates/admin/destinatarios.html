<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Destinatarios de alertas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <a href="/admin" class="btn btn-outline-secondary btn-sm mb-3">← Panel</a>
    <h1 class="h3">Destinatarios de alertas</h1>
    <p class="text-muted">Los líderes que reciben el correo de cumpleaños.</p>

    <form th:action="@{/admin/destinatarios}" th:object="${destinatario}" method="post" class="row g-2 mb-4">
        <div class="col-md-4"><input class="form-control" th:field="*{nombre}" placeholder="Nombre" required></div>
        <div class="col-md-4"><input type="email" class="form-control" th:field="*{correo}" placeholder="Correo" required></div>
        <div class="col-md-4 d-flex align-items-center gap-3">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" th:field="*{activo}">
                <label class="form-check-label" for="activo">Activo</label>
            </div>
            <button class="btn btn-primary">Guardar</button>
        </div>
    </form>

    <table class="table table-striped align-middle">
        <thead><tr><th>Nombre</th><th>Correo</th><th>Activo</th><th></th></tr></thead>
        <tbody>
        <tr th:each="d : ${destinatarios}">
            <td th:text="${d.nombre}"></td>
            <td th:text="${d.correo}"></td>
            <td th:text="${d.activo ? 'Sí' : 'No'}"></td>
            <td>
                <form th:action="@{/admin/destinatarios/{id}/eliminar(id=${d.id})}" method="post"
                      onsubmit="return confirm('¿Eliminar este destinatario?')">
                    <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
