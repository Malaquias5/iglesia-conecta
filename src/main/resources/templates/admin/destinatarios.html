<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: cabeceraAdmin('Destinatarios')}"></th:block></head>
<body class="adm">
<header th:replace="~{fragments/layout :: menuAdmin}"></header>
<main class="adm-main">
    <div class="adm-titulo"><h1>Destinatarios de alertas</h1><p>Los líderes que reciben el correo de cumpleaños.</p></div>

    <section class="adm-card">
        <h2><i class="bi bi-person-plus-fill"></i> Agregar líder</h2>
        <form th:action="@{/admin/destinatarios}" th:object="${destinatario}" method="post" class="row g-3">
            <div class="col-12 col-md-4"><label for="nombre">Nombre</label><input class="form-control" th:field="*{nombre}" required></div>
            <div class="col-12 col-md-4"><label for="correo">Correo</label><input type="email" class="form-control" th:field="*{correo}" required></div>
            <div class="col-12 col-md-4 d-flex align-items-center">
                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" role="switch" th:field="*{activo}">
                    <label class="form-check-label" th:for="${#ids.prev('activo')}">Activo</label>
                </div>
            </div>
            <div class="col-12 text-md-end"><button class="btn btn-primary btn-guardar px-4"><i class="bi bi-check-lg"></i> Guardar</button></div>
        </form>
    </section>

    <section class="adm-card">
        <h2><i class="bi bi-envelope-fill"></i> Destinatarios registrados</h2>
        <p class="vacio-adm" th:if="${#lists.isEmpty(destinatarios)}">Aún no hay destinatarios.</p>
        <table class="tabla-adm" th:unless="${#lists.isEmpty(destinatarios)}">
            <thead><tr><th>Nombre</th><th>Correo</th><th>Estado</th><th></th></tr></thead>
            <tbody>
            <tr th:each="d : ${destinatarios}">
                <td data-label="Nombre"><strong th:text="${d.nombre}"></strong></td>
                <td data-label="Correo" th:text="${d.correo}" style="word-break:break-all"></td>
                <td data-label="Estado"><span class="pill" th:classappend="${d.activo} ? 'pill-ok' : 'pill-no'" th:text="${d.activo} ? 'Activo' : 'Inactivo'"></span></td>
                <td class="accion">
                    <form th:action="@{/admin/destinatarios/{id}/eliminar(id=${d.id})}" method="post" onsubmit="return confirm('¿Eliminar este destinatario?')">
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
