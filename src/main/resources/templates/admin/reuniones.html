<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de reuniones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <a href="/admin" class="btn btn-outline-secondary btn-sm mb-3">← Panel</a>
    <h1 class="h3">Reuniones</h1>

    <form th:action="@{/admin/reuniones}" th:object="${reunion}" method="post" class="row g-2 mb-4">
        <div class="col-md-4"><input class="form-control" th:field="*{nombre}" placeholder="Nombre" required></div>
        <div class="col-md-4"><input class="form-control" th:field="*{descripcion}" placeholder="Descripción"></div>
        <div class="col-md-4"><input class="form-control" th:field="*{lugar}" placeholder="Lugar"></div>
        <div class="col-md-3">
            <select class="form-select" th:field="*{diaSemana}" required>
                <option th:each="d : ${dias}" th:value="${d}"
                        th:text="${d.getDisplayName(T(java.time.format.TextStyle).FULL, new java.util.Locale('es'))}"></option>
            </select>
        </div>
        <div class="col-md-3"><input type="time" class="form-control" th:field="*{horaInicio}" required></div>
        <div class="col-md-3"><input type="time" class="form-control" th:field="*{horaFin}"></div>
        <div class="col-md-3 d-flex align-items-center gap-3">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" th:field="*{activa}">
                <label class="form-check-label" for="activa">Activa</label>
            </div>
            <button class="btn btn-primary">Guardar</button>
        </div>
    </form>

    <table class="table table-striped align-middle">
        <thead><tr><th>Nombre</th><th>Día</th><th>Hora</th><th>Activa</th><th></th></tr></thead>
        <tbody>
        <tr th:each="r : ${reuniones}">
            <td th:text="${r.nombre}"></td>
            <td th:text="${r.diaSemana.getDisplayName(T(java.time.format.TextStyle).FULL, new java.util.Locale('es'))}"></td>
            <td th:text="${#temporals.format(r.horaInicio, 'HH:mm')}"></td>
            <td th:text="${r.activa ? 'Sí' : 'No'}"></td>
            <td>
                <form th:action="@{/admin/reuniones/{id}/eliminar(id=${r.id})}" method="post"
                      onsubmit="return confirm('¿Eliminar esta reunión?')">
                    <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
